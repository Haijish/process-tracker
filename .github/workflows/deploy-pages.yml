name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Google config
        run: |
          cat > google-config.js <<'EOF'
          window.PROCESS_TRACKER_GOOGLE_CONFIG = {
            clientId: "${{ secrets.PROCESS_TRACKER_CLIENT_ID }}",
            apiKey: "${{ secrets.PROCESS_TRACKER_API_KEY }}",
            discoveryDocs: ["https://sheets.googleapis.com/$discovery/rest?version=v4"],
            scopes: "https://www.googleapis.com/auth/drive.file",
          };
          EOF

      - name: Validate config
        run: |
          test -n "${{ secrets.PROCESS_TRACKER_CLIENT_ID }}"
          test -n "${{ secrets.PROCESS_TRACKER_API_KEY }}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
